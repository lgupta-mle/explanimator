llm:
  explanation_model: "openai/gpt-5"
  judge_model: "openai/gpt-5"
  prereq_model: "openai/gpt-5"
  code_gen_model: "anthropic/claude-sonnet-4.5"
  default_model: "openai/gpt-5"
  tiers:
    hard:
      explanation_model: "openai/gpt-4.1-mini"
      judge_model: "openai/gpt-4.1-mini"
      prereq_model: "openai/gpt-4.1-nano"
      code_gen_model: "openai/gpt-4.1-mini"
      skip_judge: true
    medium:
      explanation_model: "openai/gpt-5"
      code_gen_model: "anthropic/claude-sonnet-4.5"
    easy:
      explanation_model: "openai/gpt-5"
      code_gen_model: "anthropic/claude-sonnet-4.5"
  model_pricing:
    "openai/gpt-5":
      input: 2.5e-6
      output: 10.0e-6
    "anthropic/claude-sonnet-4.5":
      input: 3.0e-6
      output: 15.0e-6
    "openai/gpt-4.1-mini":
      input: 0.4e-6
      output: 1.6e-6
    "openai/gpt-4.1-nano":
      input: 0.1e-6
      output: 0.4e-6
    "google/gemini-2.5-flash":
      input: 0.15e-6
      output: 0.6e-6

audio:
  tts_model: "tts-1"
  voice: "nova"
  max_workers: 4
  sample_rate: 24000
  min_words_per_beat: 8
  max_words_per_beat: 25

video:
  quality: "l"
  sync_mode: "segment"
  max_speed_change: 0.3
  render_timeout: 300

manim:
  timeout: 120
  max_workers: 4
  max_retries: 3

translation:
  model: "openai/gpt-5"
  max_workers: 10
