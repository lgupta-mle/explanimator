<!DOCTYPE html>
<html>
<head>
    <title>Add UL Video to LocalStorage</title>
</head>
<body>
    <h1>Add Unified Latents Video</h1>
    <button onclick="addVideo()">Add Video to My Videos</button>
    <p id="status"></p>
    
    <script>
        function addVideo() {
            const videoEntry = {
                "job_id": "6e4688e0-92cc-49f0-8ba8-c5bf4c4d4d27",
                "paper_title": "Unified Latents (UL): How to train your latents (Scholar)",
                "date": new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
                "duration_seconds": 376.9,
                "segments_count": 5,
                "difficulty": "medium"
            };
            
            // Get existing videos
            let existing = [];
            try {
                const raw = localStorage.getItem("anvaya_videos");
                if (raw) {
                    existing = JSON.parse(raw);
                }
            } catch (e) {
                console.error("Failed to load existing videos:", e);
            }
            
            // Check if already exists
            const alreadyExists = existing.some(v => v.job_id === videoEntry.job_id);
            if (alreadyExists) {
                document.getElementById("status").textContent = "✓ Video already exists in My Videos";
                return;
            }
            
            // Add to beginning of array
            existing.unshift(videoEntry);
            
            // Save back
            try {
                localStorage.setItem("anvaya_videos", JSON.stringify(existing));
                document.getElementById("status").textContent = "✓ Video added successfully! Go to My Videos page to see it.";
            } catch (e) {
                document.getElementById("status").textContent = "✗ Failed to save: " + e.message;
            }
        }
    </script>
</body>
</html>
